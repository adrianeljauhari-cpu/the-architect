# Local Postgres for dev and integration tests (blueprint §19.6).
# Image tag postgres:17 is a version pin — recorded in blueprint §11.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - portal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portal_db:
